x-app-environment: &app-environment
  YUXI_ENV: production
  LITE_MODE: "false"
  RUNNING_IN_DOCKER: "true"
  PYTHONPATH: /app/package
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Run install.sh init first}
  API_KEY_DERIVATION_SECRET: ${API_KEY_DERIVATION_SECRET:?Run install.sh init first}
  YUXI_INSTANCE_ID: ${YUXI_INSTANCE_ID:?Run install.sh init first}
  POSTGRES_URL: postgresql+asyncpg://jiangqing:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/jiangqing
  REDIS_URL: redis://redis:6379/0
  MINIO_URI: http://minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}
  MILVUS_URI: http://milvus:19530
  MILVUS_DB_NAME: default
  NEO4J_URI: bolt://graph:7687
  NEO4J_USERNAME: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
  SANDBOX_PROVIDER: provisioner
  SANDBOX_PROVISIONER_URL: http://sandbox-provisioner:8002
  SANDBOX_PROVISIONER_TOKEN: ${SANDBOX_PROVISIONER_TOKEN:?Run install.sh init first}
  SANDBOX_VIRTUAL_PATH_PREFIX: /home/gem/user-data
  SANDBOX_EXEC_TIMEOUT_SECONDS: "180"
  SANDBOX_MAX_OUTPUT_BYTES: "262144"
  YUXI_USER_DATA_DIR: /app/user-data
  YUXI_SKILL_DATA_DIR: /app/skill-sources
  YUXI_SKILL_PROJECTION_DIR: /app/skill-projections
  NLTK_DATA: /home/yuxi/nltk_data
  RAPIDOCR_MODEL_DIR: /home/yuxi/.cache/rapidocr/models
  YUXI_CORS_ORIGINS: ${YUXI_CORS_ORIGINS:-}
  NO_PROXY: localhost,127.0.0.1,postgres,redis,minio,milvus,etcd,graph,sandbox-provisioner
  no_proxy: localhost,127.0.0.1,postgres,redis,minio,milvus,etcd,graph,sandbox-provisioner

x-service: &service
  platform: linux/amd64
  pull_policy: never
  restart: unless-stopped
  labels:
    io.jiangqing.customer.instance: ${YUXI_INSTANCE_ID:?Run install.sh init first}
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-app: &app
  <<: *service
  image: ${API_IMAGE:-jiangqing-api:0.2.0}
  working_dir: /app
  user: "1000:1000"
  env_file:
    - ${JIANGQING_ENV_FILE:-.env}
  volumes:
    - ${DATA_DIR:?Set absolute DATA_DIR}/user-data:/app/user-data
    - ${DATA_DIR:?Set absolute DATA_DIR}/skill-sources:/app/skill-sources
    - ${DATA_DIR:?Set absolute DATA_DIR}/skill-projections:/app/skill-projections
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy
    milvus:
      condition: service_healthy
    graph:
      condition: service_healthy
    sandbox-provisioner:
      condition: service_healthy
    storage-migrator:
      condition: service_completed_successfully

services:
  web:
    <<: *service
    image: ${WEB_IMAGE:-jiangqing-web:0.2.0}
    ports:
      - ${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-5185}:80
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/]
      interval: 15s
      timeout: 5s
      retries: 6

  api:
    <<: *app
    environment:
      <<: *app-environment
      YUXI_RUNTIME_DIR: /app/runtime/api
    command: [python, -m, uvicorn, "server.main:app", --host, 0.0.0.0, --port, "5050"]
    stop_grace_period: 60s
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/api/system/ready', timeout=10).read()"]
      interval: 15s
      timeout: 15s
      retries: 16
      start_period: 180s

  worker:
    <<: *app
    environment:
      <<: *app-environment
      YUXI_RUNTIME_DIR: /app/runtime/worker
    command: [python, -m, arq, server.worker_main.WorkerSettings]
    stop_grace_period: 60s
    healthcheck:
      test: [CMD, python, -m, arq, --check, server.worker_main.WorkerSettings]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 180s

  storage-migrator:
    <<: *app
    user: "0:0"
    restart: "no"
    environment:
      <<: *app-environment
      YUXI_RUNTIME_DIR: /app/runtime/storage-migrator
      YUXI_LEGACY_STORAGE_DIR: /app/legacy-saves
      YUXI_STORAGE_MIGRATION_QUIESCENCE_TOKEN: ${YUXI_STORAGE_MIGRATION_QUIESCENCE_TOKEN:-}
    volumes:
      - ${DATA_DIR:?Set absolute DATA_DIR}/user-data:/app/user-data
      - ${DATA_DIR:?Set absolute DATA_DIR}/skill-sources:/app/skill-sources
      - ${DATA_DIR:?Set absolute DATA_DIR}/skill-projections:/app/skill-projections
      - ${DATA_DIR:?Set absolute DATA_DIR}/legacy-saves:/app/legacy-saves
    command: [python, -m, yuxi.storage_migration]
    depends_on:
      postgres:
        condition: service_healthy

  sandbox-provisioner:
    <<: *service
    image: ${PROVISIONER_IMAGE:-jiangqing-provisioner:0.2.0}
    environment:
      PROVISIONER_BACKEND: docker
      PROVISIONER_PUBLIC_URL: http://sandbox-provisioner:8002
      SANDBOX_PROVISIONER_TOKEN: ${SANDBOX_PROVISIONER_TOKEN:?Run install.sh init first}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:?Set bundled SANDBOX_IMAGE}
      SANDBOX_CUSTOMER_PROJECT: ${COMPOSE_PROJECT_NAME:-jiangqing-customer}
      SANDBOX_CUSTOMER_INSTANCE: ${YUXI_INSTANCE_ID:?Run install.sh init first}
      SANDBOX_CONTAINER_PORT: "8080"
      SANDBOX_HEALTH_TIMEOUT_SECONDS: "300"
      SANDBOX_IDLE_TIMEOUT_SECONDS: "600"
      SANDBOX_EXEC_TIMEOUT_SECONDS: "180"
      DOCKER_NETWORK_PREFIX: ${COMPOSE_PROJECT_NAME:-jiangqing-customer}-sandbox
      DOCKER_SANDBOX_PREFIX: ${COMPOSE_PROJECT_NAME:-jiangqing-customer}-sandbox
      DOCKER_USER_DATA_HOST_PATH: ${DATA_DIR:?Set absolute DATA_DIR}/user-data
      DOCKER_SKILL_PROJECTIONS_HOST_PATH: ${DATA_DIR:?Set absolute DATA_DIR}/skill-projections
    volumes:
      - ${DATA_DIR:?Set absolute DATA_DIR}/user-data:/app/user-data
      - ${DATA_DIR:?Set absolute DATA_DIR}/skill-projections:/app/skill-projections
      - /var/run/docker.sock:/var/run/docker.sock
    command: [python, -m, uvicorn, "app:app", --host, 0.0.0.0, --port, "8002"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=5).read()"]
      interval: 10s
      timeout: 10s
      retries: 12
    depends_on:
      storage-migrator:
        condition: service_completed_successfully

  postgres:
    <<: *service
    image: postgres:16
    environment:
      POSTGRES_USER: jiangqing
      POSTGRES_DB: jiangqing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${DATA_DIR:?Set absolute DATA_DIR}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -U, jiangqing, -d, jiangqing]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    <<: *service
    image: redis:7.4.10-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - ${DATA_DIR:?Set absolute DATA_DIR}/redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    <<: *service
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}
    command: [minio, server, /minio_data, --address, "0.0.0.0:9000", --console-address, "0.0.0.0:9001"]
    volumes:
      - ${DATA_DIR:?Set absolute DATA_DIR}/minio:/minio_data
      - ${DATA_DIR:?Set absolute DATA_DIR}/minio-config:/root/.minio
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 15s
      timeout: 10s
      retries: 12

  etcd:
    <<: *service
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: [etcd, "-advertise-client-urls=http://etcd:2379", -listen-client-urls, "http://0.0.0.0:2379", --data-dir, /etcd]
    volumes:
      - ${DATA_DIR:?Set absolute DATA_DIR}/etcd:/etcd
    healthcheck:
      test: [CMD, etcdctl, endpoint, health]
      interval: 15s
      timeout: 10s
      retries: 12

  milvus:
    <<: *service
    image: milvusdb/milvus:v2.5.6
    command: [milvus, run, standalone]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}
      MILVUS_LOG_LEVEL: error
    volumes:
      - ${DATA_DIR:?Set absolute DATA_DIR}/milvus:/var/lib/milvus
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9091/healthz]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy

  graph:
    <<: *service
    image: neo4j:5.26.29
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
      NEO4J_INITIAL_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
      NEO4J_server_bolt_listen__address: 0.0.0.0:7687
      NEO4J_server_http_listen__address: 0.0.0.0:7474
    volumes:
      - ${DATA_DIR:?Set absolute DATA_DIR}/neo4j:/data
      - ${DATA_DIR:?Set absolute DATA_DIR}/neo4j-logs:/logs
    healthcheck:
      test: [CMD-SHELL, "cypher-shell -a bolt://localhost:7687 -u neo4j -p \"$$NEO4J_INITIAL_PASSWORD\" 'RETURN 1;' >/dev/null"]
      interval: 20s
      timeout: 15s
      retries: 15
      start_period: 60s

networks:
  default:
    driver: bridge
