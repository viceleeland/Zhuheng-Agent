worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  # No query strings, authentication tokens or payloads in access logs.
  log_format safe '$remote_addr $request_method $uri $status';
  access_log /dev/stdout safe;
  error_log /dev/stderr warn;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  map $uri $login_limit_key { default ''; ~^/api/auth/token/?$ $binary_remote_addr; }
  limit_req_zone $login_limit_key zone=login:1m rate=10r/m;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;
    limit_req zone=login burst=10 nodelay;
    limit_req_status 429;
    location ~* ^/api/system/ready/?$ { return 404; }
    location ~* ^/minio(?:/|$) { return 404; }
    location ~* ^/api/auth/(?:cli|initialize|register|signup)(?:/|$) { return 404; }
    location ~* ^/api/auth/oidc/(?:login-url|callback|exchange-code)(?:/|$) { return 404; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location ~ (^|/)\. { return 404; }
    location ~* ^/(?:api/)?(?:docs|redoc|openapi\.json)(?:/|$) { return 404; }
    location ~* ^/(?:src|node_modules|@vite|@fs|@id)(?:/|$) { return 404; }
    location ~* ^/(?:work|outputs)(?:/|$) { return 404; }
    location ~* \.(?:map|vue|ts|tsx|jsx|env)$ { return 404; }
    # Keep API routing explicit for subsequent endpoint access restrictions.
    location /api/ {
      set $api_backend http://changwei-api-dev:5050;
      proxy_pass $api_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Forwarded "";
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
    location /assets/ { try_files $uri =404; expires 1y; }
    location = /index.html {
      add_header Cache-Control 'no-store';
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy same-origin always;
    }
    location / { try_files $uri $uri/ /index.html; }
  }
}
